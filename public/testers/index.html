<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Testers</title>
<meta name="description" content="Join the test builds of Nebula Reset, Devoid and Tazoru on Google Play.">
<style>
  :root { --bg: #ffffff; --text: #1d1b26; --muted: #5d596b; --line: #e3e0ea; --link: #5a3fc0; --card: #f5f3fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0b17; --text: #ece9f4; --muted: #a9a4b8; --line: #2a2638; --link: #b9a6ff; --card: #1a1726; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 20px; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  p { margin: 0 0 10px; color: var(--muted); }
  .button { display: inline-block; padding: 12px 20px; border-radius: 10px; background: var(--link); color: var(--bg); font-weight: 600; text-decoration: none; }
  .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .game { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 14px; background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; text-align: center; }
  .game img { width: 80px; height: 80px; border-radius: 18px; }
  .lang { margin-top: 32px; font-size: 0.9rem; }
  .lang a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1 data-en="Test my games" data-tr="Oyunlarımı test et">Test my games</h1>

  <h2 data-en="1. Join the testers group" data-tr="1. Test grubuna katıl">1. Join the testers group</h2>
  <p data-en="Use the Google account you use on Google Play." data-tr="Google Play'de kullandığın Google hesabıyla katıl.">Use the Google account you use on Google Play.</p>
  <a class="button" href="https://groups.google.com/g/someoneisworking-testers" data-en="Join the group" data-tr="Gruba katıl">Join the group</a>

  <h2 data-en="2. Tap a game" data-tr="2. Bir oyuna dokun">2. Tap a game</h2>
  <p data-en="Tap &quot;Become a tester&quot;, then install it from Google Play." data-tr="&quot;Test kullanıcısı olun&quot; düğmesine dokun, sonra Google Play'den yükle.">Tap "Become a tester", then install it from Google Play.</p>
  <div class="games">
    <a class="game" href="https://play.google.com/apps/testing/com.someoneisworking.nebulareset"><img src="nebula-reset.png" alt="">Nebula Reset</a>
    <a class="game" href="https://play.google.com/apps/testing/com.someoneisworking.devoid"><img src="devoid.png" alt="">Devoid</a>
    <a class="game" href="https://play.google.com/apps/testing/com.someoneisworking.tazoru"><img src="tazoru.png" alt="">Tazoru</a>
  </div>

  <p class="lang"><a href="#" id="lang-toggle"></a></p>
</main>
<script>
  const toggle = document.getElementById('lang-toggle');
  function show(lang) {
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-en]')) {
      el.textContent = el.dataset[lang];
    }
    toggle.textContent = lang === 'tr' ? 'English' : 'Türkçe';
  }
  let current = new URLSearchParams(location.search).get('lang')
    || (navigator.language.toLowerCase().startsWith('tr') ? 'tr' : 'en');
  toggle.addEventListener('click', (event) => {
    event.preventDefault();
    current = current === 'tr' ? 'en' : 'tr';
    show(current);
  });
  show(current);
</script>
</body>
</html>
